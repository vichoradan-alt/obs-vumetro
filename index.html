<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>OBS VU Meter</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #111;
    --surface: #1c1c1c;
    --border: #2a2a2a;
    --text: #ddd;
    --muted: #555;
    --accent: #e8ff47;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── conexión ── */
  #screen-conn {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 2rem;
  }
  #screen-conn h1 { font-size: 14px; letter-spacing: 0.15em; color: var(--accent); }
  #screen-conn input {
    width: 100%; max-width: 320px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 14px;
    border-radius: 4px;
    outline: none;
  }
  #screen-conn input:focus { border-color: var(--accent); }
  #btn-conn {
    width: 100%; max-width: 320px;
    padding: 12px;
    background: var(--accent);
    color: #000;
    border: none;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 0.1em;
    border-radius: 4px;
    cursor: pointer;
  }
  #conn-error { font-size: 12px; color: #ff5555; min-height: 16px; }

  /* ── selector de fuentes ── */
  #screen-sources {
    display: none;
    flex: 1;
    flex-direction: column;
    padding: 1.5rem;
    gap: 12px;
  }
  #screen-sources h2 { font-size: 12px; letter-spacing: 0.12em; color: var(--muted); }
  .source-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .source-option:hover { border-color: #444; }
  .source-option.selected { border-color: var(--accent); }
  .source-option .chk {
    width: 16px; height: 16px;
    border: 1px solid var(--muted);
    border-radius: 3px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    transition: background 0.15s, border-color 0.15s;
  }
  .source-option.selected .chk { background: var(--accent); border-color: var(--accent); color: #000; }
  .source-option .sname { font-size: 13px; }
  #btn-monitor {
    padding: 12px;
    background: var(--accent);
    color: #000;
    border: none;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    font-size: 13px;
    letter-spacing: 0.1em;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 4px;
  }
  #btn-monitor:disabled { opacity: 0.4; cursor: default; }

  /* ── monitor / vúmetros ── */
  #screen-monitor {
    display: none;
    flex: 1;
    flex-direction: column;
    padding: 1rem;
    overflow: hidden;
  }

  /* toolbar */
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 0 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .toolbar-title { font-size: 11px; letter-spacing: 0.12em; color: var(--muted); }
  .toolbar-right { display: flex; gap: 10px; align-items: center; }
  .icon-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 16px;
    width: 34px; height: 34px;
    border-radius: 4px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.15s, border-color 0.15s;
  }
  .icon-btn:hover { color: var(--text); border-color: #444; }
  .icon-btn.active { color: var(--accent); border-color: var(--accent); }

  /* contenedor de canales */
  #channels {
    flex: 1;
    display: flex;
    flex-direction: row;
    gap: 14px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 4px 2px 12px;
    align-items: flex-start;
  }

  /* canal individual */
  .channel {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 18px 10px 12px;
    background: rgba(255,255,255,0.04);
    border: 1px solid #222;
    border-radius: 18px;
    min-height: min(78vh, 560px);
    max-height: 82vh;
    width: 130px;
    flex: 0 0 130px;
    overflow: hidden;
  }

  .channel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: var(--accent-color, var(--accent));
    border-radius: 18px 18px 0 0;
  }

  .ch-db {
    font-size: 11px;
    color: var(--accent-color, var(--accent));
    text-align: center;
    letter-spacing: 0.06em;
    height: 16px;
    white-space: nowrap;
  }

  .meter-row {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    justify-content: center;
    gap: 8px;
    flex: 1;
    min-height: 0;
  }

  /* ── FADER VERTICAL ── */
  .fader-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: 28px;
  }

  .fader-db-val {
    font-size: 10px;
    color: var(--accent-color, var(--accent));
    text-align: center;
    white-space: nowrap;
    height: 14px;
  }

  .fader-track {
    position: relative;
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .fader-track,
  .vu-track { height: min(62vh, 440px); }

  .fader-bg {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 100%;
    background: #2a2a2a;
    border-radius: 3px;
  }

  .fader-fill {
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 6px;
    background: var(--accent-color, var(--accent));
    border-radius: 3px;
    pointer-events: none;
  }

  .fader-thumb {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 8px;
    background: var(--accent-color, var(--accent));
    border-radius: 3px;
    pointer-events: none;
  }

  .fader-thumb.locked { background: #555; }

  .fader-input {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
    writing-mode: vertical-lr;
    direction: rtl;
    -webkit-appearance: slider-vertical;
    appearance: slider-vertical;
  }
  .fader-input:disabled { cursor: not-allowed; }

  /* ── VÚMETROS L/R ── */
  .vu-col {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    gap: 4px;
  }

  .vu-channel-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .vu-track {
    position: relative;
    width: 24px;
    background: #121212;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid #2d2d2d;
  }

  .vu-scale {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top,
      #1a4a1a 0%, #2d7a2d 40%, #5ab55a 60%,
      #b5b500 75%, #e8c400 83%, #ff6600 90%, #ff2200 100%
    );
    opacity: 0.16;
  }

  .vu-bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 0%;
    background: linear-gradient(to top,
      #b7ff5d 0%, #d7ff5d 35%, #ffe55d 60%, #ff9d4d 80%, #ff4e4e 100%
    );
    transition: height 0.04s linear;
    border-radius: 0 0 12px 12px;
  }

  .vu-peak {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: #ffffffcc;
    top: 100%;
    transition: top 0.1s linear;
  }

  .vu-channel-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .vu-labels {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: min(62vh, 440px);
    padding: 2px 0;
  }
  .vu-labels span {
    display: block;
    font-size: 10px;
    color: #777;
    letter-spacing: 0.06em;
    line-height: 1;
    text-align: right;
    width: 26px;
  }

  .ch-name {
    font-size: 11px;
    color: #aaa;
    letter-spacing: 0.14em;
    text-align: center;
    max-width: 110px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 2px;
  }

  .channel-buttons {
    display: flex;
    flex-direction: row;
    gap: 5px;
    width: 100%;
  }

  .btn {
    flex: 1;
    padding: 8px 4px;
    border: 1px solid #303030;
    border-radius: 8px;
    background: #151515;
    color: #eee;
    font-size: 9px;
    letter-spacing: 0.07em;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    text-align: center;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn:hover:not(:disabled) { background: #1f1f1f; border-color: #444; }
  .btn.active {
    background: var(--accent-color, var(--accent));
    color: #000;
    border-color: transparent;
  }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
</style>
</head>
<body>

<!-- ══ PANTALLA 1: conexión ══ -->
<div id="screen-conn">
  <h1>OBS VU METER</h1>
  <input type="text"     id="inp-host" value="ws://192.168.1.46:4455" placeholder="ws://IP:4455" />
  <input type="password" id="inp-pass" placeholder="Contraseña OBS (opcional)" />
  <button id="btn-conn" onclick="doConnect()">CONECTAR</button>
  <span id="conn-error"></span>
</div>

<!-- ══ PANTALLA 2: elegir fuentes ══ -->
<div id="screen-sources">
  <h2>ELEGÍ LAS FUENTES A MONITOREAR</h2>
  <div id="source-list"></div>
  <button id="btn-monitor" disabled onclick="goMonitor()">VER VÚMETROS</button>
</div>

<!-- ══ PANTALLA 3: vúmetros ══ -->
<div id="screen-monitor">
  <div class="toolbar">
    <span class="toolbar-title">VU METER</span>
    <div class="toolbar-right">
      <button class="icon-btn" id="btn-lock" title="Bloquear todo" onclick="toggleLock()">🔒</button>
      <button class="icon-btn" title="Volver a fuentes" onclick="goSources()">＋</button>
    </div>
  </div>
  <div id="channels"></div>
</div>

<!-- ══ LIBRERÍA OBSWebSocket ══ -->
<script>
class OBSWebSocket {
  constructor() {
    this._ws = null;
    this._msgId = 1;
    this._pending = {};
    this._handlers = {};
    this._lifecycle = {};
  }
  connect(url, password = '') {
    return new Promise((resolve, reject) => {
      if (this._ws) this.disconnect();
      this._ws = new WebSocket(url);
      this._ws.onopen = () => this._lifecycle.open?.();
      this._ws.onmessage = async (ev) => {
        const msg = JSON.parse(ev.data);
        await this._handleOp(msg, password, resolve, reject);
      };
      this._ws.onerror = () => reject(new Error('No se pudo conectar'));
      this._ws.onclose = () => { this._ws = null; this._lifecycle.close?.(); };
    });
  }
  disconnect() { if (this._ws) { this._ws.close(); this._ws = null; } }
  call(requestType, requestData = {}) {
    return new Promise((resolve, reject) => {
      if (!this._ws || this._ws.readyState !== WebSocket.OPEN)
        return reject(new Error('No conectado'));
      const requestId = String(this._msgId++);
      this._pending[requestId] = { resolve, reject };
      this._send(6, { requestType, requestId, requestData });
    });
  }
  on(eventType, callback) {
    if (!this._handlers[eventType]) this._handlers[eventType] = [];
    this._handlers[eventType].push(callback);
    return this;
  }
  onLifecycle(event, callback) { this._lifecycle[event] = callback; return this; }
  async _handleOp(msg, password, resolve, reject) {
    if (msg.op === 0) await this._identify(msg.d, password);
    else if (msg.op === 2) { resolve(); this._lifecycle.identified?.(); }
    else if (msg.op === 5) this._dispatchEvent(msg.d);
    else if (msg.op === 7) this._resolveRequest(msg.d);
  }
  async _identify(hello, password) {
    let authentication;
    if (hello.authentication && password) {
      const enc = new TextEncoder();
      const s = await crypto.subtle.digest('SHA-256', enc.encode(password + hello.authentication.salt));
      const secret = btoa(String.fromCharCode(...new Uint8Array(s)));
      const a = await crypto.subtle.digest('SHA-256', enc.encode(secret + hello.authentication.challenge));
      authentication = btoa(String.fromCharCode(...new Uint8Array(a)));
    }
    this._send(1, {
      rpcVersion: 1,
      eventSubscriptions: 65569,
      ...(authentication ? { authentication } : {})
    });
  }
  _dispatchEvent({ eventType, eventData }) {
    (this._handlers[eventType] || []).forEach(fn => fn(eventData));
  }
  _resolveRequest({ requestId, requestStatus, responseData }) {
    const cb = this._pending[requestId];
    if (!cb) return;
    delete this._pending[requestId];
    if (requestStatus.code === 100) cb.resolve(responseData || {});
    else cb.reject(new Error(`OBS ${requestStatus.code}: ${requestStatus.comment}`));
  }
  _send(op, d) { this._ws.send(JSON.stringify({ op, d })); }
}
</script>

<!-- ══ APLICACIÓN ══ -->
<script>
const obs = new OBSWebSocket();
let selectedSources = [];
let locked = true;
let peakTimers = {};
let peakValues = {};
let channelStates = {};

// Constantes de monitor type para OBS WebSocket v5
const MON_NONE    = 'OBS_MONITORING_TYPE_NONE';
const MON_MONITOR = 'OBS_MONITORING_TYPE_MONITOR_ONLY';

const ACCENT_COLORS = ['#f25f5c','#ff9f1c','#2ec4b6','#9d4edd','#8ac926','#e8ff47','#38bdf8'];

/* ── pantallas ── */
function show(id) {
  ['screen-conn','screen-sources','screen-monitor'].forEach(s => {
    document.getElementById(s).style.display = s === id ? 'flex' : 'none';
  });
}

/* ── CONECTAR ── */
async function doConnect() {
  const host = document.getElementById('inp-host').value.trim();
  const pass = document.getElementById('inp-pass').value;
  const errEl = document.getElementById('conn-error');
  errEl.textContent = 'Conectando...';
  document.getElementById('btn-conn').disabled = true;
  try {
    await obs.connect(host, pass);
    errEl.textContent = '';
    await loadSources();
    show('screen-sources');
  } catch(e) {
    errEl.textContent = e.message;
    document.getElementById('btn-conn').disabled = false;
  }
}

/* ── CARGAR FUENTES DE AUDIO ── */
async function loadSources() {
  const { inputs } = await obs.call('GetInputList');
  const audioKinds = [
    'wasapi_input_capture','wasapi_output_capture',
    'pulse_input_capture','pulse_output_capture',
    'coreaudio_input_capture','coreaudio_output_capture',
    'dshow_input','alsa_input_capture'
  ];
  let sources = inputs.filter(i => audioKinds.includes(i.inputKind));
  if (!sources.length) sources = inputs;
  const list = document.getElementById('source-list');
  list.innerHTML = '';
  sources.forEach(src => {
    const el = document.createElement('div');
    el.className = 'source-option';
    el.dataset.name = src.inputName;
    el.innerHTML = `<div class="chk"></div><span class="sname">${src.inputName}</span>`;
    el.onclick = () => toggleSource(el, src.inputName);
    list.appendChild(el);
  });
}

function toggleSource(el, name) {
  el.classList.toggle('selected');
  el.querySelector('.chk').textContent = el.classList.contains('selected') ? '✓' : '';
  selectedSources = [...document.querySelectorAll('.source-option.selected')].map(e => e.dataset.name);
  document.getElementById('btn-monitor').disabled = selectedSources.length === 0;
}

/* ── IR A MONITOR ── */
function goMonitor() {
  buildChannels();
  subscribeVU();
  show('screen-monitor');
}

function goSources() { show('screen-sources'); }

/* ── dB ↔ % fader (escala -60…0 dB) ── */
function dbToFaderPct(db) {
  const MIN = -60, MAX = 0;
  return Math.max(0, Math.min(100, ((db - MIN) / (MAX - MIN)) * 100));
}
function faderPctToDb(pct) {
  return -60 + (pct / 100) * 60;
}
function vuPct(db) {
  return db <= -60 ? 0 : db >= 0 ? 100 : ((db + 60) / 60) * 100;
}

/* ── CONSTRUIR CANALES ── */
function buildChannels() {
  const container = document.getElementById('channels');
  container.innerHTML = '';

  selectedSources.forEach((name, idx) => {
    peakValues[name] = [-Infinity, -Infinity];
    peakTimers[name] = [null, null];
    const id = safeid(name);
    const accent = ACCENT_COLORS[idx % ACCENT_COLORS.length];
    const initDb = -20;
    const initPct = dbToFaderPct(initDb);

    const ch = document.createElement('div');
    ch.className = 'channel';
    ch.style.setProperty('--accent-color', accent);

    ch.innerHTML = `
      <div class="ch-db" id="db-${id}">— dBFS</div>

      <div class="meter-row">

        <!-- FADER VERTICAL -->
        <div class="fader-col">
          <div class="fader-db-val" id="fv-${id}">${initDb.toFixed(1)} dB</div>
          <div class="fader-track" id="ft-${id}">
            <div class="fader-bg"></div>
            <div class="fader-fill" id="ff-${id}" style="height:${initPct}%"></div>
            <div class="fader-thumb${locked ? ' locked' : ''}" id="fth-${id}" style="bottom:calc(${initPct}% - 4px)"></div>
            <input class="fader-input" id="sl-${id}" type="range"
              min="0" max="100" step="1" value="${initPct.toFixed(0)}"
              ${locked ? 'disabled' : ''}
              oninput="onFader('${name}','${id}',this.value)">
          </div>
        </div>

        <!-- VÚMETROS L/R -->
        <div class="vu-col" id="vucol-${id}">
          <div class="vu-labels">
            <span>0</span><span>-3</span><span>-6</span>
            <span>-12</span><span>-18</span><span>-24</span>
            <span>-36</span><span>-48</span><span>-60</span>
          </div>
          <div class="vu-channel-col" id="vuch-${id}-0">
            <div class="vu-track">
              <div class="vu-scale"></div>
              <div class="vu-bar" id="bar-${id}-0"></div>
              <div class="vu-peak" id="peak-${id}-0"></div>
            </div>
            <div class="vu-channel-label" id="lbl-${id}-0">L</div>
          </div>
          <div class="vu-channel-col" id="vuch-${id}-1">
            <div class="vu-track">
              <div class="vu-scale"></div>
              <div class="vu-bar" id="bar-${id}-1"></div>
              <div class="vu-peak" id="peak-${id}-1"></div>
            </div>
            <div class="vu-channel-label" id="lbl-${id}-1">R</div>
          </div>
        </div>

      </div>

      <!-- NOMBRE abajo -->
      <div class="ch-name">${name}</div>

      <!-- BOTONES -->
      <div class="channel-buttons">
        <button class="btn" id="mute-${id}"
          onclick="toggleMute('${name}','${id}')"
          ${locked ? 'disabled' : ''}>MUTE</button>
        <button class="btn" id="mon-${id}"
          onclick="toggleMonitor('${name}','${id}')"
          ${locked ? 'disabled' : ''}>MON</button>
      </div>`;

    container.appendChild(ch);
    ensureChannelState(name, id);
  });
}

/* ── FADER ── FIX: castear pct a Number antes de comparar ── */
async function onFader(inputName, id, pct) {
  if (locked) return;
  const pctNum = Number(pct);
  const db = faderPctToDb(pctNum);
  document.getElementById('fv-' + id).textContent = db.toFixed(1) + ' dB';
  document.getElementById('ff-' + id).style.height = pct + '%';
  document.getElementById('fth-' + id).style.bottom = 'calc(' + pct + '% - 4px)';
  // FIX: usar pctNum (number) en la comparación, y clampear a rango válido de OBS (-100..0)
  const obsDb = pctNum <= 0 ? -100 : Math.max(-100, Math.min(0, db));
  try {
    await obs.call('SetInputVolume', {
      inputName,
      inputVolumeDb: Math.round(obsDb * 10) / 10
    });
  } catch(e) { console.warn(e.message); }
}

/* ── SUSCRIBIRSE A InputVolumeMeters ── */
let _vuAttached = false;
function subscribeVU() {
  if (_vuAttached) return;
  _vuAttached = true;
  obs.on('InputVolumeMeters', ({ inputs }) => {
    inputs.forEach(inp => {
      if (!selectedSources.includes(inp.inputName)) return;
      const id = safeid(inp.inputName);
      const levels = getInputLevels(inp);
      updateVU(id, inp.inputName, levels);
    });
  });
}

function getInputLevels(inp) {
  const levels = inp.inputLevelsMul || inp.inputLevels || [];
  const dbValues = [];
  if (Array.isArray(levels) && levels.length) {
    levels.forEach(ch => {
      let peak = -Infinity;
      if (Array.isArray(ch)) peak = ch[1] ?? ch[0] ?? -Infinity;
      else if (ch && typeof ch === 'object') peak = ch.peak ?? ch.input_peak ?? ch[1] ?? -Infinity;
      else if (typeof ch === 'number') peak = ch;
      dbValues.push(peak > 0 ? 20 * Math.log10(peak) : -Infinity);
    });
  }
  if (!dbValues.length) {
    if (typeof inp.inputVolumeDb === 'number') dbValues.push(inp.inputVolumeDb);
    else if (typeof inp.inputVolume === 'number' && inp.inputVolume > 0)
      dbValues.push(20 * Math.log10(inp.inputVolume));
    else dbValues.push(-Infinity);
  }
  return dbValues;
}

/* ── ACTUALIZAR VÚMETROS ── */
function updateVU(id, name, levels) {
  const isMono = levels.length <= 1;
  const db = levels.reduce((max, v) => Math.max(max, v), -Infinity);

  const dbEl = document.getElementById('db-' + id);
  if (dbEl) dbEl.textContent = db <= -60 || db === -Infinity
    ? '-∞ dBFS' : (db >= 0 ? '0.0' : db.toFixed(1)) + ' dBFS';

  const ch1 = document.getElementById('vuch-' + id + '-1');
  if (ch1) ch1.style.display = isMono ? 'none' : 'flex';

  const lbl0 = document.getElementById('lbl-' + id + '-0');
  const lbl1 = document.getElementById('lbl-' + id + '-1');
  if (lbl0) lbl0.textContent = isMono ? 'M' : 'L';
  if (lbl1) lbl1.textContent = 'R';

  const count = isMono ? 1 : 2;
  for (let i = 0; i < count; i++) {
    const chDb = levels[i] !== undefined ? levels[i] : -Infinity;
    const pct = vuPct(chDb);
    const bar = document.getElementById(`bar-${id}-${i}`);
    const peakEl = document.getElementById(`peak-${id}-${i}`);
    if (bar) bar.style.height = pct.toFixed(1) + '%';
    if (peakEl) {
      if (chDb > (peakValues[name][i] ?? -Infinity)) {
        peakValues[name][i] = chDb;
        peakEl.style.top = (100 - pct).toFixed(1) + '%';
        clearTimeout(peakTimers[name][i]);
        peakTimers[name][i] = setTimeout(() => {
          peakValues[name][i] = -Infinity;
          peakEl.style.top = '100%';
        }, 1500);
      }
    }
  }
}

/* ── CANDADO ── */
function toggleLock() {
  locked = !locked;
  const btn = document.getElementById('btn-lock');
  btn.textContent = locked ? '🔒' : '🔓';
  btn.classList.toggle('active', !locked);

  document.querySelectorAll('.fader-input').forEach(el => { el.disabled = locked; });
  document.querySelectorAll('.fader-thumb').forEach(el => { el.classList.toggle('locked', locked); });
  document.querySelectorAll('.btn').forEach(el => { el.disabled = locked; });
}

/* ── ESTADO INICIAL DEL CANAL ── FIX: usar enum de OBS WS v5 ── */
async function ensureChannelState(inputName, id) {
  channelStates[inputName] = { muted: false, monitor: MON_NONE };
  try {
    const r = await obs.call('GetInputMute', { inputName });
    channelStates[inputName].muted = !!r.inputMuted;
  } catch(e) {}
  try {
    const r = await obs.call('GetInputAudioMonitorType', { inputName });
    channelStates[inputName].monitor = r.monitorType || MON_NONE;
  } catch(e) {}
  updateChannelButtons(inputName, id);
}

function updateChannelButtons(inputName, id) {
  const st = channelStates[inputName] || { muted: false, monitor: MON_NONE };
  const muteBtn = document.getElementById('mute-' + id);
  const monBtn  = document.getElementById('mon-' + id);
  if (muteBtn) {
    muteBtn.textContent = st.muted ? 'UNMUTE' : 'MUTE';
    muteBtn.classList.toggle('active', st.muted);
  }
  if (monBtn) {
    // FIX: comparar contra la constante correcta de v5
    monBtn.textContent = st.monitor !== MON_NONE ? 'MON ON' : 'MON';
    monBtn.classList.toggle('active', st.monitor !== MON_NONE);
  }
}

async function toggleMute(inputName, id) {
  if (locked) return;
  channelStates[inputName] = channelStates[inputName] || { muted: false, monitor: MON_NONE };
  const desired = !channelStates[inputName].muted;
  try {
    await obs.call('SetInputMute', { inputName, inputMuted: desired });
    channelStates[inputName].muted = desired;
    updateChannelButtons(inputName, id);
  } catch(e) { console.warn(e.message); }
}

async function toggleMonitor(inputName, id) {
  if (locked) return;
  channelStates[inputName] = channelStates[inputName] || { muted: false, monitor: MON_NONE };
  // FIX: usar los enum correctos de OBS WebSocket v5
  const desired = channelStates[inputName].monitor === MON_NONE ? MON_MONITOR : MON_NONE;
  try {
    await obs.call('SetInputAudioMonitorType', { inputName, monitorType: desired });
    channelStates[inputName].monitor = desired;
    updateChannelButtons(inputName, id);
  } catch(e) { console.warn(e.message); }
}

/* ── utilidad ── */
function safeid(name) { return name.replace(/[^a-zA-Z0-9]/g, '_'); }

/* inicio */
show('screen-conn');
