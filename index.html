<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>OBS VU Meter</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #111;
    --surface: #1c1c1c;
    --border: #2a2a2a;
    --text: #ddd;
    --muted: #555;
    --accent: #e8ff47;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── conexión ── */
  #screen-conn {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 2rem;
  }
  #screen-conn h1 { font-size: 14px; letter-spacing: 0.15em; color: var(--accent); }
  #screen-conn input {
    width: 100%; max-width: 320px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 14px;
    border-radius: 4px;
    outline: none;
  }
  #screen-conn input:focus { border-color: var(--accent); }
  #btn-conn {
    width: 100%; max-width: 320px;
    padding: 12px;
    background: var(--accent);
    color: #000;
    border: none;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 0.1em;
    border-radius: 4px;
    cursor: pointer;
  }
  #conn-error { font-size: 12px; color: #ff5555; min-height: 16px; }

  /* ── selector de fuentes ── */
  #screen-sources {
    display: none;
    flex: 1;
    flex-direction: column;
    padding: 1.5rem;
    gap: 12px;
  }
  #screen-sources h2 { font-size: 12px; letter-spacing: 0.12em; color: var(--muted); }
  .source-option {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .source-option:hover { border-color: #444; }
  .source-option.selected { border-color: var(--accent); }
  .source-option .chk {
    width: 16px; height: 16px;
    border: 1px solid var(--muted);
    border-radius: 3px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    transition: background 0.15s, border-color 0.15s;
  }
  .source-option.selected .chk {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
  }
  .source-option .sname { font-size: 13px; }
  #btn-monitor {
    padding: 12px;
    background: var(--accent);
    color: #000;
    border: none;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    font-size: 13px;
    letter-spacing: 0.1em;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 4px;
  }
  #btn-monitor:disabled { opacity: 0.4; cursor: default; }

  /* ── monitor / vúmetros ── */
  #screen-monitor {
    display: none;
    flex: 1;
    flex-direction: column;
    padding: 1rem;
    gap: 0;
    overflow: hidden;
  }

  #channels {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 16px;
    align-items: stretch;
    overflow-y: auto;
    padding-right: 4px;
  }

  /* toolbar */
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 0 12px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .toolbar-title { font-size: 11px; letter-spacing: 0.12em; color: var(--muted); }
  .toolbar-right { display: flex; gap: 10px; align-items: center; }
  .icon-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 16px;
    width: 34px; height: 34px;
    border-radius: 4px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.15s, border-color 0.15s;
  }
  .icon-btn:hover { color: var(--text); border-color: #444; }
  .icon-btn.active { color: var(--accent); border-color: var(--accent); }

  /* canal */
  .channel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 14px;
    padding: 12px 8px;
    background: rgba(255,255,255,0.015);
    border: 1px solid #222;
    border-radius: 16px;
    min-height: min(75vh, 520px);
    max-height: 78vh;
  }

  .channel:last-child { border-bottom: none; }

  .meter-row {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 16px;
    width: 100%;
    flex: 1;
  }

  .vu-channels {
    display: flex;
    gap: 12px;
    align-items: flex-end;
    justify-content: center;
  }

  .vu-channel-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .vu-channel-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.12em;
  }

  .vol-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-width: 64px;
  }

  .vol-col .vol-label {
    font-size: 11px;
    color: var(--text);
    letter-spacing: 0.12em;
  }

  .vol-track {
    display: flex;
    align-items: center;
    justify-content: center;
    height: min(60vh, 560px);
  }

  .vol-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 180px;
    height: 24px;
    transform: rotate(-90deg);
    transform-origin: center;
    accent-color: var(--accent);
    cursor: pointer;
  }

  .vol-slider::-webkit-slider-runnable-track {
    height: 6px;
    background: #333;
    border-radius: 999px;
  }
  .vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    margin-top: -5px;
  }
  .vol-slider::-moz-range-track {
    height: 6px;
    background: #333;
    border-radius: 999px;
  }
  .vol-slider::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
  }

  .vol-value {
    font-size: 11px;
    color: var(--accent);
  }

  /* barra vúmetro */
  .vu-track {
    position: relative;
    width: 40px;
    height: min(72vh, 680px);
    max-height: 680px;
    background: #121212;
    border-radius: 24px;
    overflow: hidden;
    border: 1px solid #2d2d2d;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
  }

  /* gradiente fijo de fondo (escala de color) */
  .vu-scale {
    position: absolute;
    inset: 0;
    /* verde → amarillo → rojo, de abajo (silencio) a arriba (0dB) */
    background: linear-gradient(to top,
      #1a4a1a 0%,
      #2d7a2d 40%,
      #5ab55a 60%,
      #b5b500 75%,
      #e8c400 83%,
      #ff6600 90%,
      #ff2200 100%
    );
    opacity: 0.16;
  }

  /* barra activa que crece desde abajo */
  .vu-bar {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 0%;
    background: linear-gradient(to top,
      #b7ff5d 0%,
      #d7ff5d 35%,
      #ffe55d 60%,
      #ff9d4d 80%,
      #ff4e4e 100%
    );
    transition: height 0.04s linear;
    border-radius: 0 0 20px 20px;
  }

  /* peak hold: línea horizontal */
  .vu-peak {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: #ffffffcc;
    opacity: 0.9;
    top: 100%;
    transition: top 0.1s linear;
  }

  /* marcas dB */
  .vu-labels {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    height: min(72vh, 680px);
    font-size: 12px;
    color: #fff;
    letter-spacing: 0.08em;
  }
  .vu-labels span {
    display: block;
    width: 34px;
    text-align: center;
    line-height: 1.2;
  }

  /* nombre fuente */
  .ch-name {
    font-size: 12px;
    color: #fff;
    letter-spacing: 0.18em;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    transform: rotate(180deg);
    max-height: min(14vh, 140px);
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* valor dB en vivo */
  .ch-db {
    font-size: 12px;
    color: var(--accent);
    text-align: right;
    margin-bottom: 4px;
  }

  /* control de volumen */
  .vol-row {
    display: none;
  }
  .vol-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    min-width: 64px;
  }
  .vol-col .vol-label { font-size: 11px; color: var(--text); white-space: nowrap; }
  .vol-track { display: flex; align-items: center; justify-content: center; }
  .vol-slider { accent-color: var(--accent); cursor: pointer; }
  .vol-value { font-size: 11px; color: var(--accent); }
</style>
</head>
<body>

<!-- ══ PANTALLA 1: conexión ══ -->
<div id="screen-conn">
  <h1>OBS VU METER</h1>
  <input type="text"     id="inp-host" value="ws://ip.46:4455" placeholder="ws://IP:4455" />
  <input type="password" id="inp-pass" placeholder="Contraseña OBS (opcional)" />
  <button id="btn-conn" onclick="doConnect()">CONECTAR</button>
  <span id="conn-error"></span>
</div>

<!-- ══ PANTALLA 2: elegir fuentes ══ -->
<div id="screen-sources">
  <h2>ELEGÍ LAS FUENTES A MONITOREAR</h2>
  <div id="source-list"></div>
  <button id="btn-monitor" disabled onclick="goMonitor()">VER VÚMETROS</button>
</div>

<!-- ══ PANTALLA 3: vúmetros ══ -->
<div id="screen-monitor">
  <div class="toolbar">
    <span class="toolbar-title">VU METER</span>
    <div class="toolbar-right">
      <button class="icon-btn" id="btn-lock" title="Candado volumen" onclick="toggleLock()">🔒</button>
      <button class="icon-btn" title="Volver a fuentes" onclick="goSources()">＋</button>
    </div>
  </div>
  <div id="channels"></div>
</div>


<!-- ══════════════════════════════════════════════════════════════════
     LIBRERÍA OBSWebSocket — no modificar
══════════════════════════════════════════════════ -->
<script>
class OBSWebSocket {
  constructor() {
    this._ws = null;
    this._msgId = 1;
    this._pending = {};
    this._handlers = {};
    this._lifecycle = {};
  }
  connect(url, password = '') {
    return new Promise((resolve, reject) => {
      if (this._ws) this.disconnect();
      this._ws = new WebSocket(url);
      this._ws.onopen = () => this._lifecycle.open?.();
      this._ws.onmessage = async (ev) => {
        const msg = JSON.parse(ev.data);
        await this._handleOp(msg, password, resolve, reject);
      };
      this._ws.onerror = () => reject(new Error('No se pudo conectar'));
      this._ws.onclose = () => { this._ws = null; this._lifecycle.close?.(); };
    });
  }
  disconnect() { if (this._ws) { this._ws.close(); this._ws = null; } }
  call(requestType, requestData = {}) {
    return new Promise((resolve, reject) => {
      if (!this._ws || this._ws.readyState !== WebSocket.OPEN)
        return reject(new Error('No conectado'));
      const requestId = String(this._msgId++);
      this._pending[requestId] = { resolve, reject };
      this._send(6, { requestType, requestId, requestData });
    });
  }
  on(eventType, callback) {
    if (!this._handlers[eventType]) this._handlers[eventType] = [];
    this._handlers[eventType].push(callback);
    return this;
  }
  onLifecycle(event, callback) { this._lifecycle[event] = callback; return this; }
  async _handleOp(msg, password, resolve, reject) {
    if (msg.op === 0) await this._identify(msg.d, password);
    else if (msg.op === 2) { resolve(); this._lifecycle.identified?.(); }
    else if (msg.op === 5) this._dispatchEvent(msg.d);
    else if (msg.op === 7) this._resolveRequest(msg.d);
  }
  async _identify(hello, password) {
    let authentication;
    if (hello.authentication && password) {
      const enc = new TextEncoder();
      const s = await crypto.subtle.digest('SHA-256', enc.encode(password + hello.authentication.salt));
      const secret = btoa(String.fromCharCode(...new Uint8Array(s)));
      const a = await crypto.subtle.digest('SHA-256', enc.encode(secret + hello.authentication.challenge));
      authentication = btoa(String.fromCharCode(...new Uint8Array(a)));
    }
    this._send(1, {
      rpcVersion: 1,
      // Subscribe to non-high-volume events plus InputVolumeMeters (high volume)
      eventSubscriptions: 65569,
      ...(authentication ? { authentication } : {})
    });
  }
  _dispatchEvent({ eventType, eventData }) {
    (this._handlers[eventType] || []).forEach(fn => fn(eventData));
  }
  _resolveRequest({ requestId, requestStatus, responseData }) {
    const cb = this._pending[requestId];
    if (!cb) return;
    delete this._pending[requestId];
    if (requestStatus.code === 100) cb.resolve(responseData || {});
    else cb.reject(new Error(`OBS ${requestStatus.code}: ${requestStatus.comment}`));
  }
  _send(op, d) { this._ws.send(JSON.stringify({ op, d })); }
}
</script>

<!-- ══════════════════════════════════════════════════════════════════
     APLICACIÓN — modificar acá
══════════════════════════════════════════════════ -->
<script>
const obs = new OBSWebSocket();
let selectedSources = [];   // nombres de fuentes elegidas
let locked = true;          // candado de volumen
let peakTimers = {};        // timers para decay del peak hold
let peakValues = {};        // último peak por fuente

/* ── pantallas ── */
function show(id) {
  ['screen-conn','screen-sources','screen-monitor'].forEach(s => {
    document.getElementById(s).style.display = s === id ? 'flex' : 'none';
  });
}

/* ── CONECTAR ── */
async function doConnect() {
  const host = document.getElementById('inp-host').value.trim();
  const pass = document.getElementById('inp-pass').value;
  const errEl = document.getElementById('conn-error');
  errEl.textContent = 'Conectando...';
  document.getElementById('btn-conn').disabled = true;
  try {
    await obs.connect(host, pass);
    errEl.textContent = '';
    await loadSources();
    show('screen-sources');
  } catch(e) {
    errEl.textContent = e.message;
    document.getElementById('btn-conn').disabled = false;
  }
}

/* ── CARGAR FUENTES DE AUDIO ── */
async function loadSources() {
  const { inputs } = await obs.call('GetInputList');

  // Pedimos solo las que tienen tipo de audio conocido
  // pero también aceptamos cualquiera que OBS reporte como audio
  const audioKinds = [
    'wasapi_input_capture','wasapi_output_capture',
    'pulse_input_capture','pulse_output_capture',
    'coreaudio_input_capture','coreaudio_output_capture',
    'dshow_input','alsa_input_capture'
  ];

  // Filtramos por tipo conocido; si no hay ninguno mostramos todos
  let sources = inputs.filter(i => audioKinds.includes(i.inputKind));
  if (!sources.length) sources = inputs;

  const list = document.getElementById('source-list');
  list.innerHTML = '';
  sources.forEach(src => {
    const el = document.createElement('div');
    el.className = 'source-option';
    el.dataset.name = src.inputName;
    el.innerHTML = `<div class="chk"></div><span class="sname">${src.inputName}</span>`;
    el.onclick = () => toggleSource(el, src.inputName);
    list.appendChild(el);
  });
}

function toggleSource(el, name) {
  el.classList.toggle('selected');
  el.querySelector('.chk').textContent = el.classList.contains('selected') ? '✓' : '';
  selectedSources = [...document.querySelectorAll('.source-option.selected')]
    .map(e => e.dataset.name);
  document.getElementById('btn-monitor').disabled = selectedSources.length === 0;
}

/* ── IR A MONITOR ── */
function goMonitor() {
  buildChannels();
  subscribeVU();
  show('screen-monitor');
}

function goSources() {
  show('screen-sources');
}

/* ── CONSTRUIR CANALES ── */
function buildChannels() {
  const container = document.getElementById('channels');
  container.innerHTML = '';
  selectedSources.forEach(name => {
    peakValues[name] = [-Infinity, -Infinity];
    const id = safeid(name);
    const ch = document.createElement('div');
    ch.className = 'channel';
    ch.innerHTML = `
      <div class="ch-db" id="db-${id}">— dBFS</div>
      <div class="meter-row">
        <div class="vu-labels">
          <span>0</span><span>-3</span><span>-6</span>
          <span>-12</span><span>-18</span><span>-24</span>
          <span>-36</span><span>-48</span><span>-60</span>
        </div>
        <div class="vu-channels" id="tracks-${id}">
          <div class="vu-channel-col" id="channel-0-${id}">
            <div class="vu-track">
              <div class="vu-scale"></div>
              <div class="vu-bar" id="bar-${id}-0"></div>
              <div class="vu-peak" id="peak-${id}-0"></div>
            </div>
            <div class="vu-channel-label">L</div>
          </div>
          <div class="vu-channel-col" id="channel-1-${id}">
            <div class="vu-track">
              <div class="vu-scale"></div>
              <div class="vu-bar" id="bar-${id}-1"></div>
              <div class="vu-peak" id="peak-${id}-1"></div>
            </div>
            <div class="vu-channel-label">R</div>
          </div>
        </div>
      </div>
      <div class="ch-name">${name}</div>
      <div class="vol-col" id="vol-${id}">
        <div class="vol-label">VOL</div>
        <div class="vol-track">
          <input class="vol-slider" type="range" min="0" max="100" step="1" value="80"
            oninput="setVol('${name}', this.value, '${id}')" />
        </div>
        <div class="vol-value" id="volval-${id}">80%</div>
      </div>`;
    container.appendChild(ch);
  });
}

/* ── SUSCRIBIRSE A InputVolumeMeters ── */
function subscribeVU() {
  // El evento InputVolumeMeters llega continuamente desde OBS
  obs.on('InputVolumeMeters', ({ inputs }) => {
    inputs.forEach(inp => {
      if (!selectedSources.includes(inp.inputName)) return;
      const id = safeid(inp.inputName);

      const levels = getInputLevels(inp);
      updateVU(id, inp.inputName, levels);
    });
  });
}

function getInputLevels(inp) {
  const levels = inp.inputLevelsMul || inp.inputLevels || [];
  const dbValues = [];

  if (Array.isArray(levels) && levels.length) {
    levels.forEach(ch => {
      let peak = -Infinity;
      if (Array.isArray(ch)) peak = ch[1] ?? ch[0] ?? -Infinity;
      else if (ch && typeof ch === 'object') peak = ch.peak ?? ch.input_peak ?? ch[1] ?? -Infinity;
      else if (typeof ch === 'number') peak = ch;

      dbValues.push(peak > 0 ? 20 * Math.log10(peak) : -Infinity);
    });
  }

  if (!dbValues.length) {
    if (typeof inp.inputVolumeDb === 'number') dbValues.push(inp.inputVolumeDb);
    else if (typeof inp.inputVolume === 'number' && inp.inputVolume > 0) dbValues.push(20 * Math.log10(inp.inputVolume));
    else dbValues.push(-Infinity);
  }

  return dbValues;
}

/* ── ACTUALIZAR BARRA ── */
function updateVU(id, name, levels) {
  const MIN_DB = -60;
  const MAX_DB = 0;
  const db = levels.reduce((max, value) => Math.max(max, value), -Infinity);

  const dbEl = document.getElementById('db-' + id);
  if (dbEl) dbEl.textContent = db === -Infinity ? '-∞ dBFS'
    : (db >= 0 ? '0.0' : db.toFixed(1)) + ' dBFS';

  const trackCount = Math.max(levels.length, 1);
  const bars = [
    document.getElementById(`bar-${id}-0`),
    document.getElementById(`bar-${id}-1`)
  ];
  const peaks = [
    document.getElementById(`peak-${id}-0`),
    document.getElementById(`peak-${id}-1`)
  ];
  const channels = [
    document.getElementById(`channel-0-${id}`),
    document.getElementById(`channel-1-${id}`)
  ];

  bars.forEach((bar, index) => {
    const channelDb = levels[index] ?? -Infinity;
    const pct = channelDb <= MIN_DB ? 0 : channelDb >= MAX_DB ? 100
      : ((channelDb - MIN_DB) / (MAX_DB - MIN_DB)) * 100;
    if (bar) bar.style.height = pct.toFixed(1) + '%';

    if (peaks[index]) {
      if (channelDb > (Array.isArray(peakValues[name]) ? peakValues[name][index] ?? -Infinity : -Infinity)) {
        peakValues[name][index] = channelDb;
        peaks[index].style.top = `${100 - pct.toFixed(1)}%`;
        clearTimeout(peakTimers[name]?.[index]);
        peakTimers[name] = peakTimers[name] || [];
        peakTimers[name][index] = setTimeout(() => {
          peakValues[name][index] = -Infinity;
          peaks[index].style.top = '100%';
        }, 1500);
      }
    }

    if (channels[index]) {
      channels[index].style.display = index < trackCount ? 'flex' : 'none';
    }
  });

  if (trackCount === 1) {
    const label1 = document.querySelector(`#channel-0-${id} .vu-channel-label`);
    if (label1) label1.textContent = 'M';
  } else {
    const label0 = document.querySelector(`#channel-0-${id} .vu-channel-label`);
    const label1 = document.querySelector(`#channel-1-${id} .vu-channel-label`);
    if (label0) label0.textContent = 'L';
    if (label1) label1.textContent = 'R';
  }
}

/* ── CANDADO ── */
function toggleLock() {
  locked = !locked;
  document.getElementById('btn-lock').textContent = locked ? '🔒' : '🔓';
  document.getElementById('btn-lock').classList.toggle('active', !locked);
  document.querySelectorAll('.vol-row').forEach(el => {
    el.classList.toggle('visible', !locked);
  });
}

/* ── VOLUMEN ── */
async function setVol(inputName, pct, id) {
  document.getElementById('volval-' + id).textContent = pct + '%';
  const db = pct <= 0 ? -100 : 20 * Math.log10(pct / 100);
  try {
    await obs.call('SetInputVolume', {
      inputName,
      inputVolumeDb: Math.round(db * 10) / 10
    });
